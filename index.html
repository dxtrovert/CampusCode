<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>CampusCode — Hackathon Arena</title>
    <link rel="stylesheet" href="/theme.css" />
    <script>
      (() => {
        const key = 'campuscode-theme'
        let savedTheme
        try {
          savedTheme = localStorage.getItem(key)
        } catch (error) {
          console.warn('CampusCode could not read the saved theme.', error)
        }
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#101014' : '#f8f7f3')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
